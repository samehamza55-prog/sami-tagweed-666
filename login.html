<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بوابة دورة التجويد</title><link rel="stylesheet" href="/static/style.css"></head><body class="loginbg"><main class="login card"><div class="mark">۞</div><p class="eyebrow">بوابة المتابعة والإنجاز</p><h1>دورة التجويد</h1><p class="muted">مساحة خاصة وآمنة لمتابعة نتائج الطلاب</p>{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="alert">{{m}}</div>{% endfor %}{% endwith %}<form method="post"><label>نوع الدخول</label><select name="kind" id="kind" onchange="document.getElementById('userrow').style.display=this.value==='student'?'block':'none'"><option value="student">طالب — عرض نتائجي</option><option value="admin">مسؤول — إدارة الدورة</option></select><div id="userrow"><label>اسم الدخول</label><input name="username" placeholder="مثال: student1" autocomplete="username"></div><label>كلمة المرور</label><input type="password" name="password" required autocomplete="current-password" placeholder="أدخل كلمة المرور"><button class="primary">دخول آمن</button></form><small>كل طالب يرى نتائجه فقط.</small></main><script>document.getElementById('kind').dispatchEvent(new Event('change'));</script></body></html>
